<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ONE Absen">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>ONE Absen</title>
<link rel="manifest" href="kiosk.webmanifest">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{
  --bg:#070b1a;--bg2:#0e1530;--glass:#ffffff0d;--glass2:#ffffff17;--line:#ffffff1f;--ink:#f4f6fc;--muted:#9aa4c2;
  --pri:#6b7cff;--in1:#22d389;--in2:#0f9a5f;--out1:#ffb547;--out2:#f0732a;--bad:#ff5a52;--warn:#ffb547;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --vh:100vh;
}
@supports (height:100dvh){:root{--vh:100dvh}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden;
  background:radial-gradient(1200px 700px at 15% -10%,#2a3a8a55,transparent 60%),radial-gradient(900px 600px at 110% 110%,#0f9a5f33,transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg));background-color:var(--bg)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;font-weight:600;background:var(--glass2);color:var(--ink);transition:transform .08s,background .2s}
button:active{transform:scale(.97)}button.pri{background:var(--pri)}button:disabled{opacity:.5}
input{font:inherit;font-size:1.5rem;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#00000040;color:var(--ink);width:100%;text-align:center;letter-spacing:.12em;text-transform:uppercase;outline:none}
input:focus{border-color:var(--pri)}
.screen{position:fixed;inset:0;display:none}.screen.on{display:flex}

/* header */
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;padding:calc(14px + var(--safe-t)) 26px 14px;z-index:5}
header img{height:30px;opacity:.95}
header .office{font-weight:600;font-size:1.05rem;padding-left:16px;border-left:1px solid var(--line)}
header .office small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;margin-top:2px}
header .grow{flex:1}
.clock{text-align:right}.clock b{display:block;font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}.clock span{color:var(--muted);font-size:.85rem}

/* camera screen — portrait: stacked; landscape: side by side */
#cam{flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(84px + var(--safe-t)) 20px calc(18px + var(--safe-b))}
.stage{position:relative;flex:none;width:min(88vw,calc((var(--vh) - 470px) * .75),540px);aspect-ratio:3/4;border-radius:32px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--line),0 30px 80px #000a;transition:box-shadow .3s}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 46% 40% at 50% 44%,transparent 98%,#00000066 100%);pointer-events:none}
.ring{position:absolute;inset:10% 18% 20%;border:3px dashed #ffffff40;border-radius:50%;transition:border-color .25s,box-shadow .25s;z-index:1}
.ring.face{border-style:solid;border-color:var(--pri);box-shadow:0 0 30px #6b7cff66}
.ring.go{border-style:solid;border-color:var(--in1);box-shadow:0 0 34px #22d38999}
.corner{position:absolute;width:42px;height:42px;border:4px solid #ffffffcc;z-index:2}
.corner.tl{top:18px;left:18px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.corner.tr{top:18px;right:18px;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.corner.bl{bottom:18px;left:18px;border-right:0;border-top:0;border-radius:0 0 0 16px}
.corner.br{bottom:18px;right:18px;border-left:0;border-top:0;border-radius:0 0 16px 0}
.sweep{position:absolute;left:8%;right:8%;height:3px;top:10%;border-radius:3px;display:none;z-index:2;
  background:linear-gradient(90deg,transparent,var(--sweep,#6b7cff),transparent);box-shadow:0 0 18px var(--sweep,#6b7cff);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%,100%{top:12%}50%{top:82%}}
.scanning .sweep{display:block}
.scanning.d-in{--sweep:#22d389}.scanning.d-out{--sweep:#ffb547}
.scanning.d-in .stage{box-shadow:0 0 0 3px #22d389,0 30px 80px #000a}.scanning.d-out .stage{box-shadow:0 0 0 3px #ffb547,0 30px 80px #000a}
.scanbar{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 20px;display:none;justify-content:space-between;align-items:center;background:linear-gradient(#0000,#000c);font-weight:700;z-index:3}
.scanning .scanbar{display:flex}
.scanbar i{position:absolute;left:0;bottom:0;height:6px;background:var(--sweep,var(--pri));transition:width .2s linear}
.scan-dir{padding:6px 16px;border-radius:999px;font-size:1.05rem;letter-spacing:.08em;color:#06121f}.scan-dir.in{background:var(--in1)}.scan-dir.out{background:var(--out1)}
#cd-s{font-variant-numeric:tabular-nums;font-size:1.1rem}

.prompt{text-align:center;min-height:64px}
.prompt b{display:block;font-size:1.65rem;font-weight:700;letter-spacing:-.01em}.prompt span{color:var(--muted);font-size:1rem}

.choose{display:flex;gap:18px;width:min(88vw,540px)}
.big-btn{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:16px;padding:22px 18px;border-radius:26px;color:#fff;text-align:left;
  box-shadow:0 14px 34px #0008,inset 0 1px 0 #ffffff40}
.big-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff26,transparent 55%);pointer-events:none}
.big-btn svg{width:46px;height:46px;flex:none}
.big-btn .t b{display:block;font-size:2.6rem;font-weight:800;letter-spacing:.06em;line-height:1}
.big-btn .t small{display:block;font-weight:600;opacity:.9;font-size:1rem;margin-top:4px}
.big-btn.in{background:linear-gradient(150deg,var(--in1),var(--in2))}
.big-btn.out{background:linear-gradient(150deg,var(--out1),var(--out2))}
.choose.wait{opacity:.35;pointer-events:none}

.actions,.scanning-actions{display:flex;justify-content:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:.95rem;font-weight:600;color:var(--ink)}
.pill svg{width:18px;height:18px}
.scanning .choose,.scanning .actions{display:none}
.scanning-actions{display:none}.scanning .scanning-actions{display:flex}
.standalone #btn-fs{display:none}
/* Safari full screen puts its own ✕ button top-left and the status bar on top — keep the logo clear of them */
.fs header{padding-top:calc(30px + var(--safe-t));padding-left:92px}
.fs #cam{padding-top:calc(100px + var(--safe-t))}
.fs .net{top:calc(94px + var(--safe-t))}

@media (orientation:landscape){
  #cam{display:none;flex-direction:row;gap:42px;padding:calc(84px + var(--safe-t)) 40px calc(24px + var(--safe-b))}
  #cam.on{display:flex}
  .stage{width:min(46vw,calc((var(--vh) - 120px) * .75),540px)}
  .side{display:flex;flex-direction:column;gap:22px;width:min(40vw,460px)}
  .choose{flex-direction:column;width:100%}
  .big-btn{padding:28px 22px}
  .prompt{text-align:left}.actions,.scanning-actions{justify-content:flex-start}
}
.side{display:contents}
@media (orientation:landscape){.side{display:flex}}

/* result overlay */
.result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#050816d9;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:20}
.result.on{display:flex;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rcard{position:relative;background:linear-gradient(180deg,#1a2347,#111836);border:1px solid var(--line);border-radius:34px;padding:42px 48px 36px;text-align:center;width:min(560px,90vw);box-shadow:0 40px 100px #000c;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.rcard .big{font-size:3.6rem;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 10px;letter-spacing:-.02em}
.rcard h2{margin:2px 0 6px;font-size:2.2rem;font-weight:800;letter-spacing:-.01em}
.rcard p{margin:6px 0;color:var(--muted);font-size:1.1rem}
.okmark{width:96px;height:96px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;background:#22d38922;box-shadow:0 0 0 10px #22d3890f}
.okmark svg{width:56px;height:56px}
.okmark .ck{stroke:var(--in1);stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .12s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.okmark.bad{background:#ff5a5222;box-shadow:0 0 0 10px #ff5a520f}.okmark.bad .ck{stroke:var(--bad)}
.okmark.warn{background:#ffb54722;box-shadow:0 0 0 10px #ffb5470f}.okmark.warn .ck{stroke:var(--warn)}
.dirtag{display:inline-block;padding:6px 18px;border-radius:999px;color:#06121f;background:var(--glass2);font-weight:800;letter-spacing:.08em}
.dirtag.in{background:var(--in1)}.dirtag.out{background:var(--out1)}

/* panels (pair, PIN, boot) */
.panel{margin:auto;background:linear-gradient(180deg,#ffffff12,#ffffff08);border:1px solid var(--line);border-radius:30px;padding:30px;width:min(460px,92vw);display:grid;gap:14px;text-align:center;box-shadow:0 30px 80px #0008}
.panel h1{margin:0;font-size:1.55rem}.panel p{margin:0;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keys button{font-size:1.7rem;padding:16px 0;background:var(--glass2);border-radius:18px}
.dots{display:flex;justify-content:center;gap:12px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);transition:background .15s}.dots i.f{background:var(--ink);border-color:var(--ink)}
.pdir{display:flex;gap:10px}.pdir button{flex:1;padding:14px;font-size:1.25rem;font-weight:800;letter-spacing:.06em;border:2px solid transparent}
.pdir button small{display:block;font-size:.8rem;font-weight:600;letter-spacing:0;opacity:.8}
.pdir button[data-pdir="in"][aria-pressed="true"]{background:linear-gradient(150deg,var(--in1),var(--in2))}
.pdir button[data-pdir="out"][aria-pressed="true"]{background:linear-gradient(150deg,var(--out1),var(--out2))}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:12px 20px;border-radius:14px;display:none;z-index:30;max-width:90vw;text-align:center}.toast.on{display:block}
.net{position:fixed;top:calc(78px + var(--safe-t));right:26px;font-size:.85rem;padding:6px 12px;border-radius:999px;background:#3a2410;color:#ffcf8a;display:none;z-index:6}.net.on{display:block}
.err{color:#ff9b93}
.diag{position:fixed;left:12px;right:12px;bottom:calc(6px + var(--safe-b));font:11px/1.3 ui-monospace,Menlo,monospace;color:#9aa4c2;display:none;z-index:40;text-align:center}.diag.on{display:block}
</style>
</head>
<body>
<header id="hdr" hidden><img src="assets/logo.png" alt="ONEderland"><div class="office" id="h-office"></div><span class="grow"></span><div class="clock"><b id="h-time">--:--</b><span id="h-date"></span></div></header>
<div class="net" id="net"></div>
<div class="diag" id="diag"></div>

<section class="screen on" id="boot"><div class="panel"><img src="assets/logo.png" alt="ONEderland" style="height:34px;margin:0 auto"><p id="boot-msg">Memuat… · Loading…</p></div></section>

<section class="screen" id="pair"><form class="panel" id="pair-form" autocomplete="off">
  <img src="assets/logo.png" alt="ONEderland" style="height:36px;margin:0 auto">
  <h1>Daftarkan tablet ini</h1><p>Register this tablet — HR creates a 6-character code in HRM → Settings → Attendance → Attendance tablets.</p>
  <input id="pair-code" maxlength="7" placeholder="ABC123" inputmode="text" autocapitalize="characters">
  <p class="err" id="pair-err"></p><button class="pri" type="submit">Daftarkan · Register</button></form></section>

<section class="screen" id="cam">
  <div class="stage"><video id="video" playsinline muted autoplay></video><div class="ring" id="ring"></div>
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><i class="sweep"></i>
    <div class="scanbar"><span class="scan-dir" id="scan-dir"></span><span id="cd-s"></span><i id="cd"></i></div></div>
  <div class="side">
  <div class="prompt" id="prompt"><b>Tekan IN atau OUT</b><span>Tap IN or OUT, then look at the camera</span></div>
  <div class="choose" id="choose">
    <button type="button" class="big-btn in" id="btn-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg><span class="t"><b>IN</b><small>Masuk</small></span></button>
    <button type="button" class="big-btn out" id="btn-out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="t"><b>OUT</b><small>Pulang</small></span></button>
  </div>
  <div class="scanning-actions"><button type="button" class="pill" id="btn-cancel">✕ Batal · Cancel</button><button type="button" class="pill" id="btn-pin2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h.01M12 9h.01M17 9h.01M7 14h.01M12 14h.01M17 14h.01"/></svg>Pakai PIN</button></div>
  <div class="actions"><button type="button" class="pill" id="btn-pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h.01M12 9h.01M17 9h.01M7 14h.01M12 14h.01M17 14h.01"/></svg>Pakai PIN · Use PIN</button><button type="button" class="pill" id="btn-fs" title="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Layar penuh</button></div>
  </div>
</section>

<section class="screen" id="pin"><form class="panel" id="pin-form" autocomplete="off">
  <h1>Absen dengan PIN</h1><p>Attendance with PIN</p>
  <div class="pdir"><button type="button" data-pdir="in" aria-pressed="true">IN<small>Masuk</small></button><button type="button" data-pdir="out" aria-pressed="false">OUT<small>Pulang</small></button></div>
  <input id="pin-emp" placeholder="ID karyawan · Employee ID" autocapitalize="characters">
  <div class="dots" id="pin-dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="keys" id="keys"></div>
  <p class="err" id="pin-err"></p>
  <div style="display:flex;gap:10px"><button type="button" id="pin-cancel" style="flex:1">Batal · Cancel</button><button class="pri" type="submit" style="flex:1">Absen · Submit</button></div></form></section>

<div class="result" id="result"><div class="rcard" id="rcard"></div></div>
<div class="toast" id="toast"></div>
<canvas id="snap" hidden></canvas>
<script src="js/config.js"></script>
<script src="vendor/face-api/face-api.js"></script>
<script src="js/kiosk.js?v=5"></script>
</body>
</html>
