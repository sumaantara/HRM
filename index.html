<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: mediastream:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>ONEderland HRM</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — fixed left sidebar (off-canvas under 1100px), top bar with search/notifications/profile, content column max 1240px. */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --sunk:#f0f2f7; --ink:#151a2d; --ink2:#3a4157; --muted:#6e7489; --line:#e6e8f0; --line2:#d9dce6;
  --accent:#3554f5; --accent-ink:#ffffff; --accent-soft:#eaeefe; --accent-line:#c9d3fd;
  --ok:#14804a; --ok-soft:#e3f5ea; --warn:#b26205; --warn-soft:#fdf1df; --bad:#c2352b; --bad-soft:#fbe7e5; --off:#7a8093; --off-soft:#eef0f4;
  --t1b:#e8edff; --t1f:#3554f5; --t2b:#fff4dc; --t2f:#b8770a; --t3b:#ffeede; --t3f:#d4620e; --t4b:#f2eaff; --t4f:#7c4ddb; --t5b:#e2f6ec; --t5f:#178a52; --t6b:#ffe8ee; --t6f:#c63b62;
  --shadow:0 1px 2px rgba(21,26,45,.04),0 4px 16px rgba(21,26,45,.04);
  --f-head:"Outfit","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --sbw:264px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1219; --surface:#171b25; --sunk:#1d2230; --ink:#e9ebf2; --ink2:#c3c8d6; --muted:#9298ab; --line:#262b38; --line2:#323848;
  --accent:#7f95ff; --accent-ink:#0f1219; --accent-soft:#1f2850; --accent-line:#34407a;
  --ok:#5ccf92; --ok-soft:#14301f; --warn:#f0b35a; --warn-soft:#352812; --bad:#ff8a7f; --bad-soft:#3a1c1a; --off:#8b91a4; --off-soft:#232836;
  --t1b:#1f2850; --t1f:#93a6ff; --t2b:#352a12; --t2f:#f2c060; --t3b:#38230f; --t3f:#f59a55; --t4b:#2b2147; --t4f:#b79bff; --t5b:#13301f; --t5f:#62d39a; --t6b:#3a1a26; --t6f:#ff8fb0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1219; --surface:#171b25; --sunk:#1d2230; --ink:#e9ebf2; --ink2:#c3c8d6; --muted:#9298ab; --line:#262b38; --line2:#323848;
  --accent:#7f95ff; --accent-ink:#0f1219; --accent-soft:#1f2850; --accent-line:#34407a;
  --ok:#5ccf92; --ok-soft:#14301f; --warn:#f0b35a; --warn-soft:#352812; --bad:#ff8a7f; --bad-soft:#3a1c1a; --off:#8b91a4; --off-soft:#232836;
  --t1b:#1f2850; --t1f:#93a6ff; --t2b:#352a12; --t2f:#f2c060; --t3b:#38230f; --t3f:#f59a55; --t4b:#2b2147; --t4f:#b79bff; --t5b:#13301f; --t5f:#62d39a; --t6b:#3a1a26; --t6f:#ff8fb0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.2}
h2{font-size:1.12rem}
h3{font-size:.98rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--f-head);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.sb{position:fixed;top:0;bottom:0;left:0;width:var(--sbw);background:var(--surface);border-right:1px solid var(--line);z-index:40;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:20px 22px 18px;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:.95rem;letter-spacing:-.02em}
.brand b{font-family:var(--f-head);font-size:1.12rem;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{font-size:.66rem;letter-spacing:.16em;color:var(--muted);font-weight:600;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:10px 14px 20px}
.nav .label{display:block;padding:18px 10px 8px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:none;text-align:left;color:var(--ink2);
  padding:10px 12px;border-radius:10px;font-weight:500;font-size:.92rem}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto}
.sb-foot{padding:14px 22px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.scrim{display:none}
.col{flex:1;min-width:0;margin-left:var(--sbw);display:flex;flex-direction:column}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:72px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.ib{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2);position:relative;flex:none}
.ib.plain{border-color:transparent}
.ib:hover{background:var(--sunk)}
.dot{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.64rem;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:0 14px 0 42px}
.search > svg{position:absolute;left:13px;top:12px;color:var(--muted)}
.tb-sp{flex:1}
.me-btn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 6px;border-radius:12px;min-width:0}
.me-btn:hover{background:var(--sunk)}
.me-btn .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;text-align:left;line-height:1.2}
.me-btn .nm small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.menu-btn{display:none}
main{flex:1;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

@media (max-width:1099px){
  .sb{transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .app.open .sb{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(10,13,22,.4);z-index:35}
  .col{margin-left:0}
  .menu-btn{display:grid}
}
@media (max-width:720px){
  .tb{height:64px;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .search{display:none}
  .search.show{display:block;position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:0;right:0;max-width:none;background:var(--surface);
    padding:10px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);z-index:31}
  .search.show > svg{left:calc(max(12px,env(safe-area-inset-left,0px)) + 13px);top:22px}
  .search-toggle{display:grid!important}
  .me-btn .nm{display:none}
  main{padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:1.4rem}
  .ib{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){.sb{transition:none}}
.search-toggle{display:none!important}

/* ---------- popovers ---------- */
.pop{position:absolute;top:calc(100% + 8px);right:0;width:min(380px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 40px rgba(15,18,30,.16);z-index:50;overflow:hidden}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.pop-b{max-height:min(460px,70vh);overflow-y:auto}
.ni{display:flex;gap:12px;padding:12px 16px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.ni:hover{background:var(--sunk)}
.ni.unread{background:var(--accent-soft)}
.ni b{font-weight:600;display:block;font-size:.88rem}
.ni span{font-size:.8rem;color:var(--muted)}
.res{display:flex;gap:10px;align-items:center;padding:10px 14px;border:0;background:none;width:100%;text-align:left}
.res:hover,.res:focus{background:var(--sunk)}
.anchor{position:relative}

/* ---------- elements ---------- */
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.page-h p{color:var(--muted);margin-top:6px;max-width:64ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{flex:1;min-width:0}
.card-b{padding:20px 22px}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.c1{background:var(--t1b);color:var(--t1f)}.c2{background:var(--t2b);color:var(--t2f)}.c3{background:var(--t3b);color:var(--t3f)}
.c4{background:var(--t4b);color:var(--t4f)}.c5{background:var(--t5b);color:var(--t5f)}.c6{background:var(--t6b);color:var(--t6f)}
.grid{display:grid;gap:20px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);align-items:start}
.three{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.two{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:1180px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.split,.two,.three{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.stats{gap:12px}}
.stat{position:relative;overflow:hidden;padding:22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);text-align:left;box-shadow:var(--shadow)}
.stat::after{content:"";position:absolute;top:-1px;right:-1px;width:110px;height:110px;border-bottom-left-radius:100%;opacity:.55}
.stat.c1::after{background:var(--t1b)}.stat.c2::after{background:var(--t2b)}.stat.c3::after{background:var(--t3b)}.stat.c4::after{background:var(--t4b)}.stat.c5::after{background:var(--t5b)}
.stat.c1,.stat.c2,.stat.c3,.stat.c4,.stat.c5{color:var(--ink)}
.stat .v{font-family:var(--f-head);font-size:2.1rem;font-weight:700;line-height:1;position:relative;z-index:1}
.stat .l{color:var(--muted);font-weight:500;margin-top:6px}
.stat .lk{font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.stat .tile{position:relative;z-index:1}
@media (max-width:480px){.stat{padding:16px;gap:10px}.stat .v{font-size:1.7rem}.stat .tile{width:38px;height:38px}.stat::after{width:80px;height:80px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);
  font-weight:600;font-size:.88rem;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn.sm{height:32px;padding:0 11px;font-size:.8rem;border-radius:8px}
.btn.link{border:0;background:none;color:var(--accent);padding:0;height:auto}
.btn.link:hover{text-decoration:underline;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg.i{width:17px;height:17px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > span{font-size:.8rem;font-weight:600;color:var(--ink2)}
.f small{color:var(--muted);font-size:.76rem}
.f.full{grid-column:1/-1}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=tel],input[type=search],select,textarea{width:100%;min-height:40px;border:1px solid var(--line2);
  border-radius:10px;background:var(--surface);padding:8px 12px}
textarea{min-height:84px;resize:vertical}
.search input[type=search]{padding:0 14px 0 42px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:.88rem}
.chk input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--sunk);border-radius:11px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.84rem;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.p-pending{background:var(--warn-soft);color:var(--warn)}
.p-approved,.p-hired,.p-active{background:var(--ok-soft);color:var(--ok)}
.p-rejected,.p-expired{background:var(--bad-soft);color:var(--bad)}
.p-cancelled,.p-neutral{background:var(--off-soft);color:var(--off)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.badge{min-width:22px;height:20px;padding:0 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700;display:inline-grid;place-items:center}
.badge.zero{background:var(--sunk);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}

.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:.82rem;flex:none}
.av.sm{width:32px;height:32px;font-size:.72rem}.av.lg{width:72px;height:72px;font-size:1.4rem}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who>div>b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>div>span{display:block;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who > div{min-width:0}

/* tables -> cards on mobile */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{background:var(--sunk);color:var(--muted);font-weight:600;font-size:.8rem;text-align:left;padding:12px 22px;white-space:nowrap}
.t td{padding:14px 22px;border-top:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--sunk)}
.t td.r,.t th.r{text-align:right}
@media (max-width:720px){
  table.t.rt thead{display:none}
  table.t.rt,table.t.rt tbody,table.t.rt tr,table.t.rt td{display:block;width:100%}
  table.t.rt tr{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
  table.t.rt td{padding:0;border:0}
  table.t.rt td[data-l]::before{content:attr(data-l);display:block;font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  table.t.rt td.wide{grid-column:1/-1}
  table.t.rt td.r{text-align:right}
}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li > .grow{flex:1;min-width:0}
.empty{padding:32px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-head);font-size:1rem;margin-bottom:4px}

/* balances */
.bal{display:flex;flex-direction:column;gap:16px;padding:20px 22px}
.bal-row{display:flex;flex-direction:column;gap:7px}
.bal-row .top{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.bal-row .top .num{font-weight:600}
.bal-row .top .num small{color:var(--muted);font-weight:500}
.track{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .u{background:var(--accent)}.track .p{background:var(--warn)}

/* approval chain */
.chain{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap}
.chain li{position:relative;flex:1 1 140px;min-width:0;display:flex;gap:10px;padding:0 12px 12px 0}
.chain li::after{content:"";position:absolute;top:17px;left:42px;right:8px;height:2px;background:var(--line2)}
.chain li:last-child::after{display:none}
.chain li.ok::after{background:var(--ok)}
.chain .nd{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted);border:2px solid var(--line2);font-family:var(--f-head);font-weight:600;font-size:.74rem}
.chain .tx{position:relative;z-index:1;background:var(--surface);padding-right:6px;min-width:0}
.chain .tx b{display:block;font-size:.84rem;font-weight:600;line-height:1.3}
